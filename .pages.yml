media:
  input: imagenes
  output: /imagenes
content:
  - name: fotos
    label: Fotos
    type: file
    path: data/fotos.json
    fields:
      - name: fotos
        label: Fotos
        type: object
        list: true
        fields:
          - { name: imagen, label: Foto, type: image }
          - { name: texto, label: Texto (opcional), type: string }
  - name: videos
    label: Vídeos
    type: file
    path: data/videos.json
    fields:
      - name: videos
        label: Vídeos de YouTube
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: url, label: Enlace de YouTube, type: string }
  - name: entrenadores
    label: Entrenadores
    type: file
    path: data/entrenadores.json
    fields:
      - name: entrenadores
        label: Entrenadores
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string }
          - { name: descripcion, label: Presentación, type: text }
          - { name: foto, label: Foto, type: image }
  - name: instalaciones
    label: Instalaciones
    type: file
    path: data/instalaciones.json
    fields:
      - name: fotos
        label: Fotos
        type: object
        list: true
        fields:
          - { name: imagen, label: Foto, type: image }
          - { name: texto, label: Texto (opcional), type: string }
  - name: material
    label: Venta de material
    type: file
    path: data/material.json
    fields:
      - name: fotos
        label: Productos
        type: object
        list: true
        fields:
          - { name: imagen, label: Foto, type: image }
          - { name: texto, label: Nombre y precio, type: string }
  - name: precios
    label: Bonos y precios
    type: file
    path: data/precios.json
    fields:
      - name: precios
        label: Precios
        type: object
        list: true
        fields:
          - { name: concepto, label: Concepto, type: string }
          - { name: precio, label: Precio, type: string }
  - name: ajustes
    label: Precio mensual y horarios
    type: file
    path: data/ajustes.json
    fields:
      - { name: precio_mensual, label: Precio mensual (ej. 35 € al mes), type: string }
      - { name: horarios, label: Horarios, type: text }
